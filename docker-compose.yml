version: '3.8'

services:
  # 1. Relational Database Service (PostgreSQL 16 Alpine)
  db:
    image: postgres:16-alpine
    container_name: institute_lms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-institute_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretSecureDbPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-institute_lms}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-institute_admin} -d ${POSTGRES_DB:-institute_lms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

  # 2. Node.js Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: institute_lms_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgres://${POSTGRES_USER:-institute_admin}:${POSTGRES_PASSWORD:-SuperSecretSecureDbPassword2026!}@db:5432/${POSTGRES_DB:-institute_lms}
      JWT_SECRET: ${JWT_SECRET:-prod_jwt_super_secret_key_institute_lms_2026_secure}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: 7
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_live_institute_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_live_secret_key}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-rzp_live_webhook_secret}
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_uploads:/app/uploads
      - ./database/backups:/app/backups
    networks:
      - lms-network

  # 3. Frontend Web Server & Reverse Proxy (NGINX + React SPA)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: institute_lms_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  storage_uploads:
    driver: local
